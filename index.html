<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover so the layout reaches under a notch; the tab bar
         adds its own safe-area padding. maximum-scale is deliberate on a till:
         a stray pinch mid-rush must not leave the cashier zoomed in. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Baker's Inn" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#17171a" />
    <title>The Baker's Inn</title>
  </head>

    <script type="module" src="/src/main.jsx"></script>

</html>
