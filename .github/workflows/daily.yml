# The two jobs that have to happen on a clock, run from GitHub rather than from
# Cloud Functions.
#
# Cloud Functions would be the natural home, and functions/index.js already
# holds this exact logic. But since 2024 they cannot be deployed at all without
# a billing account — not because they would cost anything, but because Cloud
# Build and Artifact Registry refuse to enable on the free plan. This bakery
# would sit inside the free quota forever and still be blocked by a card.
#
# The work never needed to be inside a Cloud Function. It needs a clock and a
# service account, and this gives both for nothing. When Blaze is switched on,
# `firebase deploy --only functions` takes over and this file can be deleted —
# the arithmetic is shared either way, so nothing changes about the answers.

name: Daily bakery jobs

on:
  schedule:
    # GitHub runs cron in UTC. Pakistan is UTC+5 with no daylight saving, so
    # these are fixed offsets — 00:00 UTC is 05:00 in Faisalabad.
    - cron: '0 0 * * *'   # 05:00 PKT — build today's baking list
    - cron: '0 1 * * *'   # 06:00 PKT — rebuild yesterday's reports
  # So a missed morning can be put right without waiting for tomorrow.
  workflow_dispatch:
    inputs:
      job:
        description: What to run
        required: true
        default: both
        type: choice
        options: [both, compile, reports]
      date:
        description: Business date (YYYY-MM-DD), blank for today
        required: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # Without the key there is nothing to run, and a job that fails every
    # morning for a fork with no secret is just noise.
    if: github.repository == 'speeed-alt/bakers-inn'

    env:
      # Getting the cron right is only half of it. Both scripts fall back to
      # `businessDateOf()`, which reads the *process* clock against the 04:00
      # rollover — and a runner is UTC. At 00:00 UTC the hour is 0, under the
      # rollover, so it handed back yesterday: the kitchen would have got
      # yesterday's baking list every single morning, and the vans yesterday's
      # delivery notes. One line, and it is the difference between the bakery
      # working and not. Covered by scripts/dates.test.mjs.
      TZ: Asia/Karachi

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Write the service account key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not set — see README."
            exit 1
          fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/key.json"

      - name: Build the baking list
        # The 05:00 cron, or an explicit run asking for it.
        if: >-
          github.event.schedule == '0 0 * * *' ||
          (github.event_name == 'workflow_dispatch' &&
           (inputs.job == 'both' || inputs.job == 'compile'))
        env:
          SEED_PROJECT: bakers-inn-pk
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/key.json
        run: node scripts/compile-now.mjs ${{ inputs.date }}

      - name: Rebuild yesterday's reports
        # The 06:00 cron. Sales rung while a till was offline arrive whenever it
        # reconnects, which can be after the day was closed — so yesterday is
        # rebuilt once more each morning and the figures settle by themselves.
        if: >-
          github.event.schedule == '0 1 * * *' ||
          (github.event_name == 'workflow_dispatch' &&
           (inputs.job == 'both' || inputs.job == 'reports'))
        env:
          SEED_PROJECT: bakers-inn-pk
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/key.json
        run: node scripts/build-reports.mjs ${{ inputs.date }}

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/key.json"
